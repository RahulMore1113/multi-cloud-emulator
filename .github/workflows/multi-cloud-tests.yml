name: Floci Multi-Cloud Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Data Folders
        run: mkdir -p cloud-data/aws cloud-data/azure cloud-data/gcp && sudo chmod -R 777 cloud-data

      - name: Start Stack
        run: docker compose --profile all up -d

      - name: Wait for Services
        run: sleep 20

      - name: Test AWS S3
        run: |
          docker exec floci-aws-cli aws --endpoint-url=http://floci-aws:4566 s3 mb s3://test-aws-bucket
          docker exec floci-aws-cli aws --endpoint-url=http://floci-aws:4566 s3 ls

      - name: Test Azure Blob
        run: |
          CONN="DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://floci-azure:4577/devstoreaccount1;"
          docker exec floci-azure-cli az storage container create --name test-azure-container --connection-string "$CONN"

      - name: Test GCP Storage
        run: |
          docker exec floci-gcp-cli gcloud config set core/project test-proj
          docker exec floci-gcp-cli gcloud config set api_endpoint_overrides/storage http://floci-gcp:4588/
          docker exec floci-gcp-cli gcloud config set auth/disable_credentials true
          docker exec floci-gcp-cli gcloud storage buckets create gs://test-gcp-bucket --project=test-proj

      - name: Cleanup Stack
        if: always()
        run: docker compose --profile all down
